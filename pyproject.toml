[project]
name = "codelineage"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "agora-agents==2.15.0",
    "fastapi>=0.115,<1",
    "graphifyy==0.9.112",
    "google-cloud-run>=0.10,<1",
    "google-cloud-storage>=3,<4",
    "google-cloud-tasks>=2,<3",
    "neo4j>=5.26,<7",
    "httpx>=0.27,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
